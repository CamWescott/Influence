<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wanderlust Deck — Sign In</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="login-page">
  <div class="ocean-bg">
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>
    <div class="wave wave-1"></div>
    <div class="wave wave-2"></div>
    <div class="ship">
      <div class="ship-hull"></div>
      <div class="ship-deck"></div>
      <div class="ship-stack stack-1"></div>
      <div class="ship-stack stack-2"></div>
      <div class="ship-stack stack-3"></div>
    </div>
  </div>

  <main class="login-card">
    <div class="logo">
      <span class="anchor">&#9875;</span>
      <h1>Wanderlust Deck</h1>
      <p class="tagline">Your Travel Content Cruise Ship</p>
    </div>

    <form id="loginForm" class="login-form">
      <label>
        <span>Email</span>
        <input type="email" id="email" placeholder="captain@wanderlust.com" required />
      </label>
      <label>
        <span>Password</span>
        <input type="password" id="password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required minlength="4" />
      </label>
      <button type="submit" class="btn btn-primary">
        <span class="btn-ic">&#9875;</span> Set Sail
      </button>

      <div class="divider"><span>or</span></div>

      <button type="button" id="googleBtn" class="btn btn-google">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C33.6 6.1 29 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.4-.4-3.5z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 16 19 13 24 13c3 0 5.8 1.1 7.9 3l5.7-5.7C33.6 6.1 29 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/>
          <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.3 35 26.8 36 24 36c-5.3 0-9.7-3.1-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.1 5.6l6.2 5.2C40.9 35.4 44 30.2 44 24c0-1.2-.1-2.4-.4-3.5z"/>
        </svg>
        Continue with Google
      </button>
    </form>

    <p class="login-foot">New sailor? Just enter any email &amp; password to board.</p>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
